<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#090c10;
    --panel:#0d1116;
    --line: rgba(255,255,255,0.08);
    --ice:#4fd8c4;
    --ice-soft: rgba(79,216,196,0.35);
    --amber:#ffb454;
    --text-hi:#f2f6f5;
    --text-mid:#aab4b8;
    --text-low:#5c6a6e;
    --overlay-left: rgba(6,8,10,0.94);
    --overlay-right: rgba(6,8,10,0.35);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg-void);
    color:var(--text-hi);
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }

  .bg-stage{position:fixed; inset:0; z-index:0;}
  .bg-slide{
    position:absolute; inset:0;
    background-size:cover;
    background-position:center;
    opacity:0;
    animation: slideshow 32s infinite;
    filter:saturate(0.85) brightness(0.75);
  }

  @keyframes slideshow{
    0%{opacity:0; transform:scale(1.06);}
    4%{opacity:1;}
    21%{opacity:1; transform:scale(1.12);}
    25%{opacity:0;}
    100%{opacity:0;}
  }

  .bg-overlay{
    position:fixed; inset:0; z-index:1;
    background:
      linear-gradient(100deg, var(--overlay-left) 0%, var(--overlay-left) 34%, rgba(6,8,10,0.55) 55%, var(--overlay-right) 100%),
      linear-gradient(0deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 78%, rgba(0,0,0,0.6) 100%);
    pointer-events:none;
  }

  .bg-scan{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0px, rgba(255,255,255,0.018) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:overlay;
  }

  .stage{
    position:relative; z-index:3;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:44px clamp(24px, 5vw, 76px);
  }

  .header-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
  }

  .brand{display:flex; flex-direction:column; gap:2px;}
  .brand-mark{
    font-family:'Chakra Petch',sans-serif;
    font-weight:700;
    font-size:clamp(22px, 2.4vw, 30px);
    letter-spacing:0.04em;
    transform:skewX(-6deg);
    color:var(--text-hi);
  }
  .brand-mark span{color:var(--ice);}
  .brand-sub{
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--text-low);
    font-family:'Chakra Petch',sans-serif;
  }

  .header-right{
    display:flex;
    align-items:center;
    gap:12px;
  }

  /* ---------- Sélecteur de langue ---------- */
  .lang-toggle{
    display:flex;
    align-items:center;
    gap:2px;
    padding:3px;
    border:1px solid var(--line);
    border-radius:999px;
    background:rgba(13,17,22,0.55);
    backdrop-filter:blur(6px);
    flex-shrink:0;
  }
  .lang-toggle button{
    border:0;
    background:transparent;
    cursor:pointer;
    font-family:'Chakra Petch',sans-serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.06em;
    color:var(--text-low);
    padding:7px 13px;
    border-radius:999px;
    transition: background .18s ease, color .18s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .lang-toggle button:hover{ color:var(--text-hi); }
  .lang-toggle button.active{
    background:var(--ice);
    color:#06110f;
  }
  .lang-toggle button.active:hover{ color:#06110f; }

  .profile{
    display:flex;
    align-items:center;
    gap:12px;
    padding:8px 16px 8px 8px;
    border:1px solid var(--line);
    border-radius:999px;
    background:rgba(13,17,22,0.55);
    backdrop-filter:blur(6px);
  }

  .avatar{
    width:38px;height:38px;
    border-radius:50%;
    background:linear-gradient(145deg,var(--ice),#2a8f81);
    display:flex;align-items:center;justify-content:center;
    font-family:'Chakra Petch',sans-serif;
    font-weight:700;font-size:14px;color:#06110f;
    flex-shrink:0;
  }

  .profile-text{line-height:1.25;text-align:left;}
  .profile-name{font-weight:600;font-size:14px;color:var(--text-hi);}
  .profile-role{font-size:11px;color:var(--text-mid);letter-spacing:0.02em;}

  .menu-wrap{display:flex;flex-direction:column;gap:26px;padding-bottom:6px;}
  .menu-primary{display:flex;flex-direction:column;gap:6px;}

  .menu-item{
    position:relative;
    display:flex;
    align-items:baseline;
    gap:16px;
    width:fit-content;
    background:none;
    border:none;
    cursor:pointer;
    padding:4px 4px 4px 22px;
    font-family:'Chakra Petch',sans-serif;
    color:var(--text-mid);
    text-align:left;
    text-decoration:none;
    -webkit-tap-highlight-color:transparent;
  }

  .menu-item .index{font-size:12px;color:var(--text-low);width:16px;}
  .menu-item .label{
    font-weight:600;
    letter-spacing:0.03em;
    transition:color .18s ease,transform .18s ease;
  }

  .menu-item::before{
    content:"";
    position:absolute;
    left:0;top:50%;
    transform:translateY(-50%) scaleY(0);
    width:3px;height:100%;
    background:var(--ice);
    transition:transform .2s ease;
    transform-origin:center;
  }

  .menu-item:hover::before,
  .menu-item:focus-visible::before{transform:translateY(-50%) scaleY(1);}
  .menu-item:hover .label,
  .menu-item:focus-visible .label{color:var(--text-hi);transform:translateX(6px);}
  .menu-item:focus-visible{outline:2px solid var(--ice-soft);outline-offset:4px;border-radius:4px;}

  .menu-primary .menu-item:nth-child(1) .label{
    font-size:clamp(30px,4vw,44px);
    color:var(--text-hi);
  }
  .menu-primary .menu-item:nth-child(1){margin-bottom:4px;}
  .menu-primary .menu-item:nth-child(1)::before{background:var(--amber);}
  .menu-primary .menu-item:nth-child(1):hover .label{
    color:var(--amber);
    text-shadow:0 0 22px rgba(255,180,84,0.45);
  }
  .menu-primary .menu-item:nth-child(1) .index{display:none;}
  .menu-primary .menu-item:not(:nth-child(1)) .label{font-size:clamp(18px,2vw,22px);}

  .menu-secondary{
    display:flex;
    align-items:center;
    gap:22px;
    padding-left:22px;
    border-top:1px solid var(--line);
    padding-top:14px;
    width:fit-content;
  }

  .menu-secondary .menu-item{padding-left:0;}
  .menu-secondary .menu-item::before{display:none;}
  .menu-secondary .menu-item .label{
    font-size:12px;
    color:var(--text-low);
    letter-spacing:0.08em;
    font-weight:600;
  }
  .menu-secondary .menu-item:hover .label{color:var(--text-mid);transform:none;}
  .menu-secondary .menu-item .index{display:none;}

  .footer-row{display:flex;justify-content:space-between;align-items:flex-end;}
  .build-tag{
    font-family:'Chakra Petch',sans-serif;
    font-size:11px;
    letter-spacing:0.1em;
    color:var(--text-low);
  }
  .scroll-hint{font-size:11px;color:var(--text-low);letter-spacing:0.06em;}

  @media (prefers-reduced-motion:reduce){
    .bg-slide{animation:none;opacity:0.6;}
    .bg-slide:nth-child(1){opacity:0.6;}
    .bg-slide:not(:nth-child(1)){display:none;}
  }

  @media (max-width:640px){
    .header-row{flex-direction:row;}
    .profile{padding:6px 10px 6px 6px;}
    .profile-text{display:none;}
    .menu-secondary{flex-wrap:wrap;row-gap:8px;}
  }
</style>
</head>
<body>

  <div class="bg-stage" id="bgStage"></div>
  <div class="bg-overlay"></div>
  <div class="bg-scan"></div>

  <div class="stage">

    <div class="header-row">
      <div class="brand">
        <div class="brand-mark">PORT<span>FOLIO</span></div>
        <div class="brand-sub">ROMAIN WEIGEL — BUILD 2026.08</div>
      </div>

      <div class="header-right">
        <div class="lang-toggle" role="group" aria-label="Langue / Language">
          <button type="button" data-lang="fr" class="active" aria-pressed="true">FR</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>

        <div class="profile">
          <div class="avatar">RW</div>
          <div class="profile-text">
            <div class="profile-name">Romain Weigel</div>
            <div class="profile-role" data-i18n="role">
              Étudiant · Développeur Informatique
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="menu-wrap">
      <nav class="menu-primary" data-i18n-aria="nav_primary" aria-label="Navigation principale">

        <a class="menu-item" href="./projets.html">
          <span class="index">01</span>
          <span class="label" data-i18n="header_buttons.projects">
            PROJETS
          </span>
        </a>

        <a class="menu-item" href="./introduction.html">
          <span class="index">02</span>
          <span class="label" data-i18n="header_buttons.presentation">
            PRÉSENTATION
          </span>
        </a>

        <a class="menu-item" href="./contact.html">
          <span class="index">03</span>
          <span class="label" data-i18n="header_buttons.contact">
            CONTACT
          </span>
        </a>

        
        <a class="menu-item" href="./loisir.html">
          <span class="index">03</span>
          <span class="label" data-i18n="header_buttons.contact">
            LOISIR
          </span>
        </a>

      </nav>

      <nav class="menu-secondary" data-i18n-aria="nav_secondary" aria-label="Navigation secondaire">
        <a class="menu-item" id="cvLink" href="./static/CV_Weigel_Romain.pdf" target="_blank" rel="noopener">
          <span class="label" data-i18n="introduction.pdfdownloadlink">
            OUVRIR LE CV EN PDF
          </span>
        </a>
      </nav>
    </div>

    <div class="footer-row">
      <div class="build-tag" data-i18n="buildTag">SCROLL/CLIC POUR NAVIGUER — PAGES À VENIR</div>
      <div class="scroll-hint">v0.1</div>
    </div>

  </div>

  <script>
    const BG_FOLDER = 'static/fond_acceuil/';
    const BG_IMAGES = [
      'kitchen_wtf.png',
      'flamenco_2.png',
      'ProtoDemoImage.png'
    ];
    const SLOT_SECONDS = 8;

    const stage = document.getElementById('bgStage');
    const cycleDuration = BG_IMAGES.length * SLOT_SECONDS;

    BG_IMAGES.forEach((filename, index) => {
      const slide = document.createElement('div');
      slide.className = 'bg-slide';
      slide.style.backgroundImage = `url('${BG_FOLDER}${filename}')`;
      slide.style.animationDuration = `${cycleDuration}s`;
      slide.style.animationDelay = `${index * SLOT_SECONDS}s`;
      stage.appendChild(slide);
    });

    /* ====================================================================
       TRADUCTION
       ==================================================================== */
    let currentLang = 'fr';
    let data = null;

    function getDataUrl() {
      return currentLang === 'en' ? 'static/en.json' : 'static/fr.json';
    }

    // Textes fixes qui n'existent pas dans fr.json / en.json
    const UI_STRINGS = {
      fr: {
        role: 'Étudiant · Développeur Informatique',
        nav_primary: 'Navigation principale',
        nav_secondary: 'Navigation secondaire',
        buildTag: 'SCROLL/CLIC POUR NAVIGUER — PAGES À VENIR'
      },
      en: {
        role: 'Student · Software Developer',
        nav_primary: 'Main navigation',
        nav_secondary: 'Secondary navigation',
        buildTag: 'SCROLL/CLICK TO NAVIGATE — MORE PAGES COMING SOON'
      }
    };

    function getByPath(obj, path) {
      return path.split('.').reduce(
        (acc, key) => (acc && acc[key] !== undefined) ? acc[key] : undefined,
        obj
      );
    }

    function applyTranslations() {
      const strings = UI_STRINGS[currentLang] || UI_STRINGS.fr;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n.trim();
        if (strings[key] !== undefined) {
          el.textContent = strings[key];
        } else if (data) {
          const value = getByPath(data, key);
          if (typeof value === 'string') el.textContent = value;
        }
      });

      document.querySelectorAll('[data-i18n-aria]').forEach(el => {
        const key = el.dataset.i18nAria.trim();
        if (strings[key] !== undefined) el.setAttribute('aria-label', strings[key]);
      });

      const cvLink = document.getElementById('cvLink');
      if (cvLink && data) {
        const pdfLink = getByPath(data, 'introduction.pdf_link');
        if (pdfLink) cvLink.setAttribute('href', pdfLink);
      }

      document.documentElement.lang = currentLang;
    }

    async function loadData() {
      try {
        const response = await fetch(getDataUrl(), { cache: 'no-cache' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        data = await response.json();
      } catch (error) {
        console.error('Impossible de charger les données', error);
        data = null;
      }
      applyTranslations();
    }

    const langButtons = [...document.querySelectorAll('.lang-toggle button')];
    langButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const lang = btn.dataset.lang;
        if (lang === currentLang) return;

        currentLang = lang;
        langButtons.forEach(b => {
          const active = b === btn;
          b.classList.toggle('active', active);
          b.setAttribute('aria-pressed', String(active));
        });

        loadData();
      });
    });

    loadData();
  </script>
</body>
</html>
