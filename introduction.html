<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Présentation — Romain Weigel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#090c10;
    --panel:#0d1116;
    --panel-raised:#11161c;
    --line: rgba(255,255,255,0.08);
    --ice:#4fd8c4;
    --ice-soft: rgba(79,216,196,0.35);
    --amber:#ffb454;
    --amber-soft: rgba(255,180,84,0.35);
    --text-hi:#f2f6f5;
    --text-mid:#aab4b8;
    --text-low:#5c6a6e;
  }

  *{box-sizing:border-box;}
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg-void);
    color:var(--text-hi);
    font-family:'Inter',sans-serif;
  }

  /* ---------- Fond ---------- */
  .bg-stage{ position:fixed; inset:0; z-index:0; }
  .bg-slide{
    position:absolute; inset:0;
    background-size:cover; background-position:center;
    background-repeat:no-repeat;
    filter:saturate(0.85) brightness(0.55) blur(1px);
  }
  .bg-overlay{
    position:fixed; inset:0; z-index:1;
    background: linear-gradient(180deg, rgba(6,8,10,0.92) 0%, rgba(6,8,10,0.88) 100%);
    pointer-events:none;
  }
  .bg-scan{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0px, rgba(255,255,255,0.018) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:overlay;
  }

  /* ====================================================================
     ÉCRAN DE CHARGEMENT — identique à la page Projets : le logo glisse
     depuis la gauche en tournant sur lui-même, puis fondu de sortie.
     ==================================================================== */
  .boot-screen{
    position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:26px;
    background:var(--bg-void);
    opacity:1;
    transition: opacity 0.7s ease;
  }
  .boot-screen.leaving{
    opacity:0;
    pointer-events:none;
  }
  .boot-logo-stage{
    position:relative;
    width:100%;
    max-width:520px;
    height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .boot-logo-ring{
    position:relative;
    width:112px; height:112px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    opacity:0;
    animation: logoSlideIn 1.5s cubic-bezier(.22,.75,.28,1) forwards;
  }
  .boot-logo-ring::before{
    content:"";
    position:absolute; inset:-8px;
    border-radius:50%;
    border:1px solid var(--ice-soft);
    box-shadow:0 0 26px rgba(79,216,196,0.25);
  }
  .boot-logo{
    width:100%; height:100%;
    border-radius:50%;
    object-fit:cover;
    background:var(--panel-raised);
    animation: logoSpin 1.5s linear forwards, logoSpinIdle 3.2s linear 1.5s infinite;
  }
  @keyframes logoSlideIn{
    0%{ transform:translateX(-220%); opacity:0; }
    12%{ opacity:1; }
    100%{ transform:translateX(0); opacity:1; }
  }
  @keyframes logoSpin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(900deg); }
  }
  @keyframes logoSpinIdle{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }
  .boot-mark{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700;
    font-size:clamp(18px, 2.4vw, 24px);
    letter-spacing:0.08em;
    color:var(--text-low);
    transform:skewX(-6deg);
    opacity:0;
    animation: bootTextIn 0.6s ease 1.15s forwards;
  }
  .boot-mark span{ color:var(--ice); }
  @keyframes bootTextIn{ to{ opacity:1; } }

  .page-shell{ opacity:0; }
  body.booted .page-shell{
    opacity:1;
    transition: opacity 0.7s ease 0.15s;
  }

  @media (prefers-reduced-motion: reduce){
    .boot-screen{ display:none; }
    .page-shell{ opacity:1; }
  }

  /* ====================================================================
     CONTENU
     ==================================================================== */
  .page-shell{ position:relative; z-index:3; }

    .top-bar{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    padding:28px clamp(20px, 5vw, 72px) 0;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand-mark{
    font-family:'Chakra Petch', sans-serif; font-weight:700;
    font-size:clamp(18px, 2vw, 22px); letter-spacing:0.04em;
    transform:skewX(-6deg); color:var(--text-hi);
  }
  .brand-mark span{ color:var(--ice); }
  .back-link{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'Chakra Petch', sans-serif;
    font-size:12px; letter-spacing:0.1em; font-weight:600;
    color:var(--text-mid); text-decoration:none;
    padding:8px 14px 8px 10px;
    border:1px solid var(--line); border-radius:999px;
    transition: border-color .18s ease, color .18s ease;
  }
  .back-link:hover{ color:var(--ice); border-color:var(--ice-soft); }
  .back-link svg{ width:14px; height:14px; }
  .top-bar-right{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .main-nav{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .nav-link{
    font-family:'Chakra Petch', sans-serif;
    font-size:12px; font-weight:600; letter-spacing:0.08em;
    color:var(--text-mid);
    text-decoration:none;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid transparent;
    transition: color .18s ease, border-color .18s ease, background .18s ease;
  }
  .nav-link:hover{ color:var(--text-hi); }
  .nav-link.active{
    color:var(--ice);
    background:rgba(79,216,196,0.1);
    border-color:var(--ice-soft);
  }

  @media (max-width:760px){
    .top-bar{ flex-wrap:wrap; row-gap:14px; }
    .main-nav{ order:3; width:100%; justify-content:center; }
  }
  .lang-toggle{
    display:flex; padding:3px; gap:3px;
    border:1px solid var(--line); border-radius:999px;
    background:rgba(9,12,16,0.72);
  }
  .lang-toggle button{
    min-width:32px;
    border:0; border-radius:999px;
    background:transparent;
    color:var(--text-low);
    font-family:'Chakra Petch', sans-serif;
    font-size:11px; font-weight:700; letter-spacing:0.06em;
    padding:6px 10px;
    cursor:pointer;
    transition:background .18s ease, color .18s ease;
  }
  .lang-toggle button:hover{ color:var(--text-hi); }
  .lang-toggle button.active{ background:var(--ice); color:#06110f; }

  /* ---------- Hero ---------- */
  .page-head{
    padding:40px clamp(20px, 5vw, 72px) 10px;
  }
  .page-eyebrow{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .page-eyebrow .bar{ width:3px; height:18px; background:var(--amber); }
  .page-eyebrow span{
    font-family:'Chakra Petch', sans-serif;
    font-size:12px; letter-spacing:0.14em; color:var(--text-low);
  }

  .hero-grid{
    display:grid;
    grid-template-columns:1.6fr 1fr;
    gap:44px;
    align-items:center;
  }
  .page-title{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700;
    font-size:clamp(34px, 6vw, 58px);
    letter-spacing:0.01em;
    transform:skewX(-4deg);
    margin:0 0 10px;
  }
  .hero-subheading{
    font-family:'Chakra Petch', sans-serif;
    font-size:13px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--ice);
    margin:0 0 16px;
  }
  .page-intro{
    max-width:64ch;
    color:var(--text-mid);
    font-size:15px; line-height:1.7;
    margin:0;
  }
  .hero-actions{ margin-top:24px; }
  .cv-btn{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'Chakra Petch', sans-serif;
    font-size:12px; font-weight:700; letter-spacing:0.06em;
    color:var(--bg-void); background:var(--ice);
    border-radius:999px; padding:12px 22px;
    text-decoration:none;
    transition:opacity .18s ease, transform .18s ease;
  }
  .cv-btn:hover{ opacity:0.88; transform:translateY(-1px); }
  .cv-btn svg{ width:15px; height:15px; }

  .hero-portrait{ display:flex; justify-content:center; }
  .portrait-frame{
    position:relative;
    width:100%; max-width:250px; aspect-ratio:1;
    border-radius:50%;
    overflow:hidden;
    border:2px solid var(--ice-soft);
    box-shadow:0 0 40px rgba(79,216,196,0.16);
    background:var(--panel-raised);
  }
  .portrait-frame img{ width:100%; height:100%; object-fit:cover; display:block; }

  @media (max-width:820px){
    .hero-grid{ grid-template-columns:1fr; }
    .hero-portrait{ order:-1; }
    .portrait-frame{ max-width:170px; }
  }

  /* ---------- Carte état civil ---------- */
  .info-card{
    margin:34px clamp(20px, 5vw, 72px) 0;
    padding:24px 26px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
  }
  .info-card h3{
    font-family:'Chakra Petch', sans-serif;
    font-size:13px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--text-low);
    margin:0 0 18px;
  }
  .info-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));
    gap:16px 26px;
    margin:0;
  }
  .info-grid dt{
    font-family:'Chakra Petch', sans-serif;
    font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--text-low);
    margin:0 0 4px;
  }
  .info-grid dd{
    margin:0; font-size:14px; color:var(--text-hi);
  }

  /* ---------- Sections timeline (parcours / expérience) ---------- */
  .section{
    padding:40px clamp(20px, 5vw, 72px) 0;
  }
  .section-title{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700;
    font-size:clamp(20px, 3vw, 26px);
    letter-spacing:0.01em;
    transform:skewX(-4deg);
    margin:0 0 20px;
  }
  .timeline{ display:flex; flex-direction:column; gap:12px; }
  .timeline-item{
    display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:12px;
    padding:18px 20px;
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--ice);
    border-radius:6px;
    transition: border-color .2s ease, transform .2s ease;
  }
  .timeline-item:hover{ transform:translateX(2px); border-color:var(--ice-soft); }
  .timeline-item.experience{ border-left-color:var(--amber); }
  .timeline-item.experience:hover{ border-color:var(--amber-soft); }
  .timeline-item-main{ flex:1; min-width:220px; }
  .timeline-item-title{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; font-size:16px; margin:0 0 5px; color:var(--text-hi); line-height:1.35;
  }
  .timeline-item-sub{ font-size:13px; color:var(--text-mid); margin:0 0 4px; }
  .timeline-item-inst{
    font-family:'Chakra Petch', sans-serif;
    font-size:11px; letter-spacing:0.06em; color:var(--text-low); margin:0; text-transform:uppercase;
  }
  .timeline-item-dates{
    font-family:'Chakra Petch', sans-serif;
    font-size:11px; letter-spacing:0.08em; color:var(--text-low);
    white-space:nowrap;
    padding:5px 12px; border:1px solid var(--line); border-radius:999px;
  }

  /* ---------- Activités ---------- */
  .activity-card{
    padding:22px 24px;
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--amber);
    border-radius:6px;
  }
  .activity-card h4{
    font-family:'Chakra Petch', sans-serif;
    font-size:17px; margin:0 0 10px; color:var(--text-hi);
  }
  .activity-card p{
    font-size:13.5px; line-height:1.65; color:var(--text-mid); margin:0 0 14px;
  }
  .activity-date{
    font-family:'Chakra Petch', sans-serif;
    font-size:11px; letter-spacing:0.08em; color:var(--text-low);
  }

  .page-shell > .section:last-of-type{ padding-bottom:70px; }

  /* ---------- Modal / popup ---------- */
  .modal-backdrop{
    position:fixed; inset:0; z-index:50;
    background:rgba(6,8,10,0.82);
    backdrop-filter:blur(6px);
    display:none;
    align-items:center; justify-content:center;
    padding:24px;
  }
  .modal-backdrop.open{ display:flex; }
  .popup-modal{
    width:min(480px, 100%);
    background:var(--panel);
    border:1px solid var(--line); border-radius:8px;
    position:relative;
  }
  .modal-close{
    position:absolute; top:14px; right:14px; z-index:2;
    width:34px; height:34px; border-radius:50%;
    background:rgba(9,12,16,0.75); border:1px solid var(--line);
    color:var(--text-hi); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .modal-close:hover{ border-color:var(--ice-soft); color:var(--ice); }
  .popup-content{ padding:34px 28px 30px; }
  .popup-content h2{
    font-family:'Chakra Petch', sans-serif; font-weight:700;
    font-size:22px; margin:0 0 14px;
  }
  .popup-content p{ color:var(--text-mid); line-height:1.65; font-size:14px; margin:0; }
</style>
</head>
<body>

  <!-- Fond -->
  <div class="bg-stage" id="bgStage"></div>
  <div class="bg-overlay"></div>
  <div class="bg-scan"></div>

  <!-- Écran de chargement -->
  <div class="boot-screen" id="bootScreen">
    <div class="boot-logo-stage">
      <div class="boot-logo-ring">
        <img class="boot-logo" src="static/logo.png" alt="Romain Weigel">
      </div>
    </div>
    <div class="boot-mark">PORT<span>FOLIO</span></div>
  </div>

  <!-- Contenu -->
  <div class="page-shell">

        <div class="top-bar">
      <div class="brand">
        <div class="brand-mark">PORT<span>FOLIO</span></div>
      </div>

      <nav class="main-nav" id="mainNav" aria-label="Navigation principale">
        <a class="nav-link active" id="navPresentation" href="introduction.html" data-i18n="header_buttons.presentation">Présentation</a>
        <a class="nav-link" id="navProjects" href="projets.html" data-i18n="header_buttons.projects">Projets</a>
        <a class="nav-link" id="navContact" href="contact.html" data-i18n="header_buttons.contact">Contact</a>
        <a class="nav-link" id="navLoisir" href="loisir.html" data-i18n="header_buttons.loisir">Loisir</a>
      </nav>

      <div class="top-bar-right">
        <div class="lang-toggle" role="group" aria-label="Langue / Language">
          <button type="button" data-lang="fr" class="active" aria-pressed="true">FR</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <a class="back-link" href="index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
          <span data-i18n="back">RETOUR</span>
        </a>
      </div>
    </div>

    <header class="page-head">
      <div class="page-eyebrow"><div class="bar"></div><span id="eyebrowText">PRÉSENTATION</span></div>

      <div class="hero-grid">
        <div class="hero-text">
          <h1 class="page-title" id="introTitle"></h1>
          <h2 class="hero-subheading" id="introSubheading"></h2>
          <p class="page-intro" id="introContent"></p>
          <div class="hero-actions">
            <a class="cv-btn" id="cvLink" href="#" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg>
              <span id="cvLinkText"></span>
            </a>
          </div>
        </div>
        <div class="hero-portrait">
          <div class="portrait-frame"><img src="static/logo.png" alt="Romain Weigel"></div>
        </div>
      </div>
    </header>

    <section class="info-card">
      <h3 id="personalTitle"></h3>
      <dl class="info-grid" id="personalGrid"></dl>
    </section>

    <section class="section">
      <h2 class="section-title" id="parcoursTitle"></h2>
      <div class="timeline" id="educationTimeline"></div>
    </section>

    <section class="section">
      <h2 class="section-title" id="experienceTitle"></h2>
      <div class="timeline" id="experienceTimeline"></div>
    </section>

    <section class="section">
      <h2 class="section-title" id="activitiesTitle"></h2>
      <div class="activity-card" id="activityCard"></div>
    </section>

  </div>

  <!-- Popup "projets à venir" -->
  <div class="modal-backdrop" id="popupBackdrop">
    <div class="popup-modal" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
      <button class="modal-close" id="popupCloseBtn" aria-label="Fermer">✕</button>
      <div class="popup-content">
        <h2 id="popupTitle"></h2>
        <p id="popupText"></p>
      </div>
    </div>
  </div>

  <script>
    /*
      Toutes les données affichées sur cette page proviennent de
      static/fr.json ou static/en.json (clé "introduction" et
      "header_buttons"). Rien n'est dupliqué en dur ici.
    */

    let currentLang = 'fr';
    function getDataUrl() {
      return currentLang === 'en' ? 'static/en.json' : 'static/fr.json';
    }
    const BACKGROUND_IMAGE = 'static/fond_acceuil/kitchen_wtf.png';

    const stage = document.getElementById('bgStage');
    const background = document.createElement('div');
    background.className = 'bg-slide';
    background.style.backgroundImage = `url('${BACKGROUND_IMAGE}')`;
    stage.appendChild(background);

    function escapeHtml(value = '') {
      return String(value).replace(/[&<>"']/g, char => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;'
      }[char]));
    }

    const UI_STRINGS = {
      fr: { eyebrow: 'PRÉSENTATION', popup_close: 'Fermer', back: 'RETOUR', load_error: "Impossible de charger la page. Vérifie que le fichier static/fr.json existe bien et que la page est ouverte depuis un serveur web." },
      en: { eyebrow: 'ABOUT', popup_close: 'Close', back: 'BACK', load_error: "Unable to load the page. Check that the static/en.json file exists and that the page is served from a web server." }
    };

    function applyUIStrings(strings) {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (strings[key] !== undefined) el.textContent = strings[key];
      });
    }

    let data = null;

    function renderTimeline(entries, extraClass = '') {
      return Object.values(entries || {}).map(item => `
        <div class="timeline-item ${extraClass}">
          <div class="timeline-item-main">
            <p class="timeline-item-title">${escapeHtml(item.title || '')}</p>
            <p class="timeline-item-sub">${escapeHtml(item.specialization || '')}</p>
            <p class="timeline-item-inst">${escapeHtml(item.institution || '')}</p>
          </div>
          <span class="timeline-item-dates">${escapeHtml(item.dates || '')}</span>
        </div>
      `).join('');
    }

    function render() {
      const intro = data.introduction;
      const nav = data.header_buttons || {};
      const strings = UI_STRINGS[currentLang] || UI_STRINGS.fr;

      document.title = `${nav.presentation || 'Présentation'} — ${intro.title || ''}`;
      document.documentElement.lang = currentLang;

      document.getElementById('eyebrowText').textContent = strings.eyebrow;

      document.getElementById('introTitle').textContent = intro.title || '';
      document.getElementById('introSubheading').textContent = intro.subheading || '';
      document.getElementById('introContent').textContent = intro.content || '';

      const cv = document.getElementById('cvLink');
      cv.href = intro.pdf_link || '#';
      document.getElementById('cvLinkText').textContent = intro.pdfdownloadlink || '';

      document.getElementById('personalTitle').textContent = intro.title_personal || '';
      const pi = intro.personal_info || {};
      const fields = [
        [pi.strong_etat_civil, pi.etat_civil],
        [pi.strong_email, pi.email],
        [pi.strong_adresse, pi.adresse],
        [pi.strong_date_naissance, pi.date_naissance],
        [pi.strong_permis, pi.permis]
      ].filter(([label, value]) => label || value);

      document.getElementById('personalGrid').innerHTML = fields.map(([label, value]) => `
        <div>
          <dt>${escapeHtml(label || '')}</dt>
          <dd>${escapeHtml(value || '')}</dd>
        </div>
      `).join('');

      document.getElementById('parcoursTitle').textContent = intro.parcour || '';
      document.getElementById('educationTimeline').innerHTML = renderTimeline(intro.education);

      document.getElementById('experienceTitle').textContent = intro.experience_title || '';
      document.getElementById('experienceTimeline').innerHTML = renderTimeline(intro.experience_pro, 'experience');

      const activites = intro.activites || {};
      document.getElementById('activitiesTitle').textContent = activites.main_title || '';
      const act = activites.actualite1 || {};
      document.getElementById('activityCard').innerHTML = `
        <h4>${escapeHtml(act.titre || '')}</h4>
        <p>${escapeHtml(act.content || '')}</p>
        <span class="activity-date">${escapeHtml(act.date || '')}</span>
      `;

      const popup = intro.popup || {};
      document.getElementById('popupTitle').textContent = popup.popuptitle || '';
      document.getElementById('popupText').textContent = popup.texte || '';

      document.getElementById('navPresentation').textContent = nav.presentation || 'Présentation';
      document.getElementById('navProjects').textContent = nav.projects || 'Projets';
      document.getElementById('navContact').textContent = nav.contact || 'Contact';
      document.getElementById('navLoisir').textContent = nav.loisir || 'Loisir';

      document.getElementById('popupCloseBtn').setAttribute('aria-label', strings.popup_close);

      applyUIStrings(strings);
    }

    async function loadData() {
      try {
        const response = await fetch(getDataUrl(), { cache: 'no-cache' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        data = await response.json();
        render();
      } catch (error) {
        console.error('Impossible de charger les données', error);
        const strings = UI_STRINGS[currentLang] || UI_STRINGS.fr;
        document.getElementById('introContent').textContent = strings.load_error;
      }
    }

    /*
      LANGUE
    */
    const langButtons = [...document.querySelectorAll('.lang-toggle button')];
    langButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const lang = btn.dataset.lang;
        if (lang === currentLang) return;

        currentLang = lang;
        langButtons.forEach(b => {
          const active = b === btn;
          b.classList.toggle('active', active);
          b.setAttribute('aria-pressed', String(active));
        });

        loadData();
      });
    });

    /*
      POPUP "Projets à venir" — s'affiche une fois par session, après le
      chargement, et peut être fermée (croix, clic hors modale, Echap).
    */
    const popupBackdrop = document.getElementById('popupBackdrop');

    function showPopup() {
      if (sessionStorage.getItem('introPopupDismissed')) return;
      popupBackdrop.classList.add('open');
    }
    function closePopup() {
      popupBackdrop.classList.remove('open');
      sessionStorage.setItem('introPopupDismissed', '1');
    }

    document.getElementById('popupCloseBtn').addEventListener('click', closePopup);
    popupBackdrop.addEventListener('click', event => {
      if (event.target === popupBackdrop) closePopup();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && popupBackdrop.classList.contains('open')) closePopup();
    });

    /*
      SÉQUENCE DE CHARGEMENT — identique à la page Projets : le logo
      glisse depuis la gauche en tournant (1.5s), une courte pause,
      puis tout l'écran de boot s'efface en fondu pendant que la page
      apparaît.
    */
    (function boot() {
      const screen = document.getElementById('bootScreen');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      loadData();

      if (reduceMotion) {
        document.body.classList.add('booted');
        screen.remove();
        setTimeout(showPopup, 400);
        return;
      }

      const LOGO_ARRIVAL = 1500;
      const HOLD = 550;
      const FADE_OUT = 700;

      setTimeout(() => {
        screen.classList.add('leaving');
        document.body.classList.add('booted');

        setTimeout(() => {
          screen.remove();
          showPopup();
        }, FADE_OUT);
      }, LOGO_ARRIVAL + HOLD);
    })();
  </script>
</body>
</html>
